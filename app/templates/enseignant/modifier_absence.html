{% extends 'base.html' %}
{% block content %}
<h2>Modifier l'absence</h2>
<form method="post">
    <div class="mb-3">
        <label>Justifiée :</label>
        <input type="checkbox" name="justifiee" {% if absence.justifiee %}checked{% endif %}>
    </div>
    <div class="mb-3">
        <label>Motif :</label>
        <input type="text" name="motif" class="form-control" value="{{ absence.motif }}">
    </div>
    <div class="mb-3">
        <label>Commentaire :</label>
        <input type="text" name="commentaire" class="form-control" value="{{ absence.commentaire }}">
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="{{ url_for('enseignant.absences') }}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
